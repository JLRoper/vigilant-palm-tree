name: Validate Game

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: validate-game-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: game_poc
          POSTGRES_USER: gameuser
          POSTGRES_PASSWORD: gamepass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: npm install
        run: npm install

      - name: Install Playwright browser (chromium)
        run: npx playwright install chromium --with-deps

      - name: Validate "npm run dev" boots client + API
        run: |
          npm run dev > dev-run.log 2>&1 &
          DEV_PID=$!

          for i in $(seq 1 60); do
            if [ -f .env ]; then
              CLIENT_PORT=$(grep -oP 'CLIENT_PORT=\K\d+' .env || true)
              API_PORT=$(grep -oP 'API_PORT=\K\d+' .env || true)
              if [ -n "$CLIENT_PORT" ] && [ -n "$API_PORT" ]; then break; fi
            fi
            sleep 1
          done

          if [ -z "$CLIENT_PORT" ] || [ -z "$API_PORT" ]; then
            echo "predev never wrote CLIENT_PORT/API_PORT to .env within 60s"
            kill $DEV_PID 2>/dev/null || true
            exit 1
          fi

          echo "Waiting for client on :$CLIENT_PORT and API on :$API_PORT ..."

          API_UP=false
          CLIENT_UP=false
          for i in $(seq 1 60); do
            if ! $API_UP; then
              curl -sf "http://127.0.0.1:$API_PORT/api/health" > /dev/null && API_UP=true || true
            fi
            if ! $CLIENT_UP; then
              curl -sf "http://127.0.0.1:$CLIENT_PORT" > /dev/null && CLIENT_UP=true || true
            fi
            if $API_UP && $CLIENT_UP; then break; fi
            sleep 1
          done

          kill $DEV_PID 2>/dev/null || true

          $API_UP || { echo "API server never responded healthy on port $API_PORT"; exit 1; }
          $CLIENT_UP || { echo "Vite dev server never responded on port $CLIENT_PORT"; exit 1; }
          echo "npm run dev booted successfully (client=$CLIENT_PORT api=$API_PORT)"

      - name: Dump "npm run dev" boot log
        if: always()
        run: |
          if [ -f dev-run.log ]; then cat dev-run.log; fi

      - name: Reset local dev state before smoke test
        run: |
          rm -f .env dev-run.log

      - name: npm run build
        run: npm run build

      - name: npm test (smoke test)
        run: npm test

      - name: Upload smoke test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-output
          path: |
            test/*.log
            test/*.png
          if-no-files-found: ignore
