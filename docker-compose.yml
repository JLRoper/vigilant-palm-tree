# docker-compose.yml -- the shared stack (db/api/web/adminer) AND the template
# for per-run pods.
#
# Shared stack (today's behaviour, unchanged): `npm run db:up`,
# `npm run docker:deploy`. Every POD_* value below is unset, so the defaults
# resolve to exactly the names/ports/database this file has always used:
# game_db / game_api / game_web / game_adminer, 5432 / 3001 / 5173 / 8080,
# database game_poc.
#
# Pods: `npm run pod:up` (scripts/pods.ts) runs this file as ONE compose
# project per pod -- `docker compose -p heroes-pod-<name> -f docker-compose.yml
# -f docker/docker-compose.pod.yml up -d db api web` -- with the POD_* values
# set. Project scoping renames the network and volume per pod
# (heroes-pod-<name>_heroes-network, heroes-pod-<name>_game_db_data) and the
# POD_* values below give each pod its own container names, host ports,
# database and image tags, so `docker compose -p heroes-pod-<name> ... down -v`
# removes exactly that pod and nothing else. The pod identity labels live in
# docker/docker-compose.pod.yml (they must be ABSENT for the shared stack, and
# compose cannot express a conditional label).
services:
  db:
    image: postgres:16-alpine
    container_name: "${POD_CONTAINER_PREFIX:-game}_db"
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POD_DB_NAME:-game_poc}
      POSTGRES_USER: gameuser
      POSTGRES_PASSWORD: gamepass
    ports:
      - "${POD_DB_PORT:-5432}:5432"
    volumes:
      - game_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gameuser -d game_poc"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - heroes-network

  api:
    # Parameterized tag: a pod builds/uses its OWN api image so it never
    # retags the shared stack's heroes-js-api out from under game_api.
    image: ${POD_API_IMAGE:-heroes-js-api}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api-runtime
      # Client build stamps the commit hash; .git is not in the build context,
      # so it is passed in from the host. Use `npm run docker:build` (which
      # resolves it from git) rather than a bare `docker compose build`.
      args:
        VITE_COMMIT_HASH: ${VITE_COMMIT_HASH:-dev}
    container_name: "${POD_CONTAINER_PREFIX:-game}_api"
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: gameuser
      PGPASSWORD: gamepass
      PGDATABASE: ${POD_DB_NAME:-game_poc}
      API_PORT: 3001
      LAN_HOST: 1
    ports:
      - "${POD_API_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - heroes-network
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null http://localhost:3001/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3

  web:
    image: ${POD_WEB_IMAGE:-heroes-js-web}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web-runtime
      args:
        VITE_COMMIT_HASH: ${VITE_COMMIT_HASH:-dev}
    container_name: "${POD_CONTAINER_PREFIX:-game}_web"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    # Redeploy with `npm run docker:build` (rebuilds BOTH api and web -- the
    # engine lives server-side, so the api image must ship with the client)
    # then `docker compose up -d --remove-orphans api web` so any legacy
    # `game_gateway` container is removed before `game_web` binds host port 5173.
    ports:
      - "${POD_WEB_PORT:-5173}:80"
    networks:
      - heroes-network
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null http://127.0.0.1:80 || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3

  adminer:
    image: adminer:latest
    container_name: "${POD_CONTAINER_PREFIX:-game}_adminer"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${POD_ADMINER_PORT:-8080}:8080"
    networks:
      - heroes-network

volumes:
  game_db_data:

networks:
  heroes-network:
    driver: bridge
