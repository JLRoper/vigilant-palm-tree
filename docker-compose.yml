services:
  db:
    image: postgres:16-alpine
    container_name: game_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: game_poc
      POSTGRES_USER: gameuser
      POSTGRES_PASSWORD: gamepass
    ports:
      - "5432:5432"
    volumes:
      - game_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gameuser -d game_poc"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - heroes-network

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api-runtime
    container_name: game_api
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: gameuser
      PGPASSWORD: gamepass
      PGDATABASE: game_poc
      API_PORT: 3001
      LAN_HOST: 1
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - heroes-network
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null http://localhost:3001/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web-runtime
    container_name: game_web
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - heroes-network
    environment:
      # `vite preview` reads this and proxies /api/* to the api service
      API_HOST: api
      API_PORT: "3001"
      CLIENT_PORT: "5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null http://127.0.0.1:5173 || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3

  adminer:
    image: adminer:latest
    container_name: game_adminer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - heroes-network

volumes:
  game_db_data:

networks:
  heroes-network:
    driver: bridge
