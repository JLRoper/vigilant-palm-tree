<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>heroes-js</title>
    <style>
      :root {
        --tb-bg-top: #1b2334;
        --tb-bg-bottom: #121826;
        --tb-strip: #10151f;
        --tb-surface: rgba(255, 255, 255, 0.045);
        --tb-surface-hover: rgba(255, 255, 255, 0.1);
        --tb-border: rgba(148, 163, 184, 0.22);
        --tb-border-hover: rgba(148, 163, 184, 0.4);
        --tb-text: #e9eef8;
        --tb-text-muted: #9aa7bd;
        --tb-text-dim: #b6c0d4;
        --tb-accent: #f2b93c;
        --tb-accent-light: #ffd479;
        --tb-accent-ink: #241a05;
        --tb-menu-bg: rgba(20, 26, 40, 0.98);
        --tb-divider: rgba(148, 163, 184, 0.18);
        --tb-font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue",
          Arial, sans-serif;
        --tb-radius-control: 8px;
        --tb-radius-chip: 999px;
        --tb-radius-kbd: 4px;
        --tb-radius-menu: 12px;
        --tb-radius-menu-item: 7px;
        --tb-shadow-control: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        --tb-shadow-ready: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 2px 8px rgba(0, 0, 0, 0.35), 0 0 0 3px rgba(242, 185, 60, 0.16);
        --tb-shadow-header: 0 10px 28px rgba(0, 0, 0, 0.45);
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #111;
        overflow: hidden;
        font-family: system-ui, sans-serif;
        color: #eee;
      }
      /* The UI is dark throughout; without this the browser paints native
         scrollbars, form controls and focus rings in their light-mode colors. */
      :root {
        color-scheme: dark;
      }
      /* Firefox */
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.22) transparent;
      }
      /* Chrome/Edge/Safari — match the menu panel rather than the OS default. */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.35);
        border-radius: 5px;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.18);
        border-radius: 5px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.3);
        background-clip: content-box;
      }
      ::-webkit-scrollbar-corner {
        background: transparent;
      }
      #app {
        position: fixed;
        inset: 0;
        z-index: 0;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: grab;
      }
      canvas:active {
        cursor: grabbing;
      }
      #toolbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        width: 100%;
        z-index: 10;
        box-sizing: border-box;
      }
      #toolbar > * {
        pointer-events: auto;
      }
      #toolbar button {
        cursor: pointer;
      }
      #toolbar button:disabled {
        cursor: default;
        opacity: 0.45;
      }
      #toolbar button:not(:disabled):hover {
        filter: brightness(1.16);
      }
      #toolbar button:not(:disabled):active {
        transform: translateY(1px);
        filter: brightness(1.04);
      }
      #toolbar button:focus-visible {
        outline: 2px solid var(--tb-accent-light, #ffd479);
        outline-offset: 2px;
      }
      #hud {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 1 1 auto;
        min-width: 0;
        font-family: var(--tb-font, system-ui, sans-serif);
        font-size: 11.5px;
        color: var(--tb-text, #e9eef8);
      }
      #hud-context {
        color: var(--tb-text-dim, #b6c0d4);
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <div id="toolbar"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
