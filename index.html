<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>heroes-js</title>
    <style>
      :root {
        --header-blue: #1c2f57;
        --header-blue-dark: #142145;
        --header-gold: #c9a227;
        --header-gold-light: #e9cf7d;
        --header-cream: #f1e4c3;
        --header-font: Georgia, "Cambria", "Times New Roman", serif;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #111;
        overflow: hidden;
        font-family: system-ui, sans-serif;
        color: #eee;
      }
      /* The UI is dark throughout; without this the browser paints native
         scrollbars, form controls and focus rings in their light-mode colors. */
      :root {
        color-scheme: dark;
      }
      /* Firefox */
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.22) transparent;
      }
      /* Chrome/Edge/Safari — match the menu panel rather than the OS default. */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.35);
        border-radius: 5px;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.18);
        border-radius: 5px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.3);
        background-clip: content-box;
      }
      ::-webkit-scrollbar-corner {
        background: transparent;
      }
      #app {
        position: fixed;
        inset: 0;
        z-index: 0;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: grab;
      }
      canvas:active {
        cursor: grabbing;
      }
      #toolbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        width: 100%;
        z-index: 10;
        box-sizing: border-box;
      }
      #toolbar > * {
        pointer-events: auto;
      }
      #hud {
        background: var(--header-blue-dark);
        color: var(--header-cream);
        font-family: var(--header-font);
        font-size: 12.5px;
        font-weight: 500;
        line-height: 1.6;
        padding: 6px 16px;
        text-align: left;
        border-top: 1px solid rgba(201, 162, 39, 0.2);
        border-bottom: 1px solid rgba(201, 162, 39, 0.35);
        letter-spacing: 0.3px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <div id="toolbar"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
